name: Medir arranque de yt-dlp (temporal)

on:
  push:
    branches: [preview-rapido]

jobs:
  medir:
    runs-on: windows-latest
    steps:
      - name: Bajar las dos versiones de yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile yt-dlp.exe
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_win.zip -OutFile yt-dlp_win.zip
          Expand-Archive yt-dlp_win.zip -DestinationPath carpeta
          python -c "import wave,struct; w=wave.open('tono.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(48000); w.writeframes(b'\x00\x00'*2*48000*60); w.close()"

      - name: Medir
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          function Medir($nombre, $exe) {
            $v = @(); $r = @()
            foreach ($i in 1..5) { $v += (Measure-Command { & $exe --version | Out-Null }).TotalMilliseconds }
            foreach ($i in 1..5) { $r += (Measure-Command { & $exe --no-warnings --print 'URL|%(url)s' 'http://127.0.0.1:8765/tono.wav' | Out-Null }).TotalMilliseconds }
            "{0,-28} --version: {1}   resolver link: {2}" -f $nombre, (($v | % { [int]$_ }) -join ' / '), (($r | % { [int]$_ }) -join ' / ')
          }
          Medir 'exe de un solo archivo' '.\yt-dlp.exe'
          Medir 'version en carpeta' '.\carpeta\yt-dlp.exe'
          Stop-Process $srv
