name: Pruebas en vivo

# Prueba el buscador contra Spotify y YouTube Music de verdad.
# Corre en las ramas de trabajo (no en main) y a mano desde Actions.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ffmpeg libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libcurl4-openssl-dev
          pipx install yt-dlp
          sudo ln -sf "$(command -v yt-dlp)" /usr/local/bin/yt-dlp
          curl -fsSL https://deno.land/install.sh | sh -s -- -y

      - name: Compilar pruebas
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLARABOYA_BUILD_TESTS=ON
          cmake --build build --target ClaraboyaGrabTests

      - name: Correr pruebas (sin internet + en vivo)
        run: ./build/ClaraboyaGrabTests_artefacts/Release/ClaraboyaGrabTests --live
