name: Compilar para Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # con historia y tags: las novedades se arman con los cambios desde la Release anterior

      - name: Versión
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(ClaraboyaGrab VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Claraboya Grab $v · build ${{ github.run_number }}"

      # El número de build queda grabado en el programa: así sabe si hay una Release más nueva.
      - name: Configurar
        run: cmake -B build -A x64 -DCLARABOYA_GRAB_BUILD=${{ github.run_number }}

      - name: Compilar VST3 + app suelta
        run: cmake --build build --config Release --target ClaraboyaGrab_VST3 ClaraboyaGrab_Standalone

      # Las pruebas del motor también en Windows (preview, descargas, aviso de versión), con las
      # herramientas instaladas por el mismo código que el botón INSTALAR. Si fallan, no se publica.
      - name: Pruebas en Windows
        shell: pwsh
        run: |
          cmake -B build-pruebas -A x64 -DCLARABOYA_BUILD_TESTS=ON
          cmake --build build-pruebas --config Release --target ClaraboyaGrabTests
          $exe = Get-ChildItem -Recurse build-pruebas -Filter ClaraboyaGrabTests.exe | Select-Object -First 1
          & $exe.FullName --instalar
          $code = $LASTEXITCODE
          Write-Host "`n---- preview-log.txt ----"
          Get-Content "$env:APPDATA\Claraboya Grab\preview-log.txt" -Tail 80 -ErrorAction SilentlyContinue
          exit $code

      # Contra YouTube de verdad desde Windows: informativo (YouTube suele bloquear a los servidores de GitHub).
      - name: Preview real desde Windows (informativo)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build-pruebas -Filter ClaraboyaGrabTests.exe | Select-Object -First 1
          & $exe.FullName --solo-vivo --live
          Write-Host "`n---- preview-log.txt ----"
          Get-Content "$env:APPDATA\Claraboya Grab\preview-log.txt" -Tail 40 -ErrorAction SilentlyContinue

      - name: Armar el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DBuildNumber=${{ github.run_number }}" installer\ClaraboyaGrab.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item salida\ClaraboyaGrab-Instalador.exe | Select-Object Name, Length

      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: ClaraboyaGrab-Windows
          path: |
            build/ClaraboyaGrab_artefacts/Release/VST3/
            build/ClaraboyaGrab_artefacts/Release/Standalone/*.exe
            salida/ClaraboyaGrab-Instalador.exe

      # Solo desde main: la versión queda publicada como Release y la web/app de Claraboya la ofrece
      # (la toman los lunes, junto con todo lo demás). Claraboya Grab avisa solo cuando aparece una nueva.
      - name: Armar el .zip para descargar
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force -Path paquete | Out-Null
          Copy-Item -Recurse "build/ClaraboyaGrab_artefacts/Release/VST3/*.vst3" paquete/
          Copy-Item "build/ClaraboyaGrab_artefacts/Release/Standalone/*.exe" paquete/
          @"
          Claraboya Grab $v (Windows)

          LO MÁS FÁCIL: el instalador
          Bajá "ClaraboyaGrab-Instalador.exe" de la misma página y abrilo: pone el plugin y el programa
          en su lugar. Después, Claraboya Grab avisa solo cuando hay una versión nueva.

          A MANO (este .zip)
          1. Copiá la carpeta "Claraboya Grab.vst3" a C:\Program Files\Common Files\VST3
          2. En Cubase: Studio > VST Plug-in Manager > actualizar. Aparece en Tools > Claraboya Grab.
          3. La primera vez tocá INSTALAR (baja yt-dlp, FFmpeg y Deno, unos 200 MB, una sola vez).
          "Claraboya Grab.exe" es la misma herramienta sin Cubase: abrilo con doble clic.

          Pensado para escuchar referencias en el estudio, no para usar ese audio en una producción.
          Bajar de YouTube y otras plataformas va contra sus términos de uso.

          Claraboya Estudio · claraboyaestudio.netlify.app
          "@ | Out-File -FilePath paquete/LEEME.txt -Encoding utf8
          Compress-Archive -Path paquete/* -DestinationPath ClaraboyaGrab-Windows.zip -Force
          Get-Item ClaraboyaGrab-Windows.zip | Select-Object Name, Length

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Novedades = los cambios desde la Release anterior (es lo que muestra el aviso dentro de la app)
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev^{commit}" >/dev/null; then
            cambios=$(git log --no-merges --format='- %s' "$prev..HEAD")
          else
            cambios=$(git log --no-merges --format='- %s' -5)
          fi
          [ -z "$cambios" ] && cambios="- Mejoras internas"
          {
            echo "Plugin VST3 para Cubase y programa suelto, para Windows. Para instalar o actualizar: ClaraboyaGrab-Instalador.exe (o el .zip, con LEEME.txt adentro)."
            echo
            echo "Novedades:"
            echo "$cambios"
          } > notas.md
          cat notas.md

          gh release create "build-${{ github.run_number }}" ClaraboyaGrab-Windows.zip salida/ClaraboyaGrab-Instalador.exe --latest \
            --target "${{ github.sha }}" \
            --title "Claraboya Grab ${VERSION} · build ${{ github.run_number }}" \
            --notes-file notas.md
